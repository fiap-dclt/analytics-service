name: CI/CD Analytics Service

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/**"

# Configurações existentes de publicação no ECR e atualização do GitOps.
env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "analytics-service"
  REGISTRY_URL: "640494160208.dkr.ecr.us-east-1.amazonaws.com"
  GITOPS_REPO: "fiap-dclt/tech-challenge-phase-3-k8s"
  MANIFEST_PATH: "analytics-service/deployment.yml"

# Todos os jobs têm somente permissão de leitura, exceto o de deploy (OIDC).
permissions:
  contents: read

jobs:
  # LINTER: verifica problemas de qualidade no código Python com Ruff.
  # Python 3.11 acompanha a versão utilizada pelo Dockerfile da aplicação.
  lint:
    name: Linter - Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.5

      - name: Run Ruff Linter
        run: ruff check --output-format=github .

  # SCA: examina o requirements.txt e outras dependências encontradas
  # no filesystem. Vulnerabilidades HIGH/CRITICAL com correção bloqueiam o job.
  sca-trivy-fs:
    name: SCA - Trivy FS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # SAST: analisa problemas de segurança no código-fonte com Horusec.
  # A CLI é instalada no runner para utilizar o Docker do próprio GitHub Actions.
  # Esta versão beta corrige a falha de interpretação da versão do Docker no v2.8.0.
  sast-horusec:
    name: SAST - Horusec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Horusec CLI
        shell: bash
        run: |
          curl -fsSL \
            https://github.com/ZupIT/horusec/releases/download/v2.9.0-beta.3/horusec_linux_amd64 \
            -o horusec
          sudo install -m 755 horusec /usr/local/bin/horusec
          horusec version
          docker version

      - name: Run Horusec SAST Scan
        shell: bash
        run: horusec start -p "$GITHUB_WORKSPACE" -e true

  # SECRET SCANNING: analisa todo o histórico Git em busca de chaves,
  # credenciais e tokens expostos. Exige checkout completo (fetch-depth: 0).
  secrets-gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git History for Secrets
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose .

  # BUILD + IMAGE SCAN + DEPLOY:
  # Aguarda a aprovação dos quatro jobs de qualidade/segurança.
  # A imagem é construída e analisada localmente antes de qualquer push ao ECR.
  # Em pull requests, executa o build e o Trivy Image, sem publicar.
  # Em push na main, publica no ECR e atualiza o manifesto no GitOps.
  build-and-update-gitops:
    name: Build, Image Scan and GitOps Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - sca-trivy-fs
      - sast-horusec
      - secrets-gitleaks
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Constrói a mesma imagem que será enviada ao ECR, mas sem publicá-la.
      - name: Build Docker Image
        shell: bash
        run: |
          docker build \
            -t "${REGISTRY_URL}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            .

      # Analisa bibliotecas Python e pacotes do sistema presentes na imagem.
      # HIGH/CRITICAL com correção disponível impedem o push e o deploy.
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY_URL }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

